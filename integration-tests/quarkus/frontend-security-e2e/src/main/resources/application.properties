quarkus.application.name=quarkus-frontend-security-e2e
quarkus.http.port=0

# Viet Template configuration
quarkus.viet-template.path=templates
quarkus.viet-template.suffix=.vtl
quarkus.viet-template.runtime-compilation-enabled=false

# Frontend asset integration configuration
quarkus.viet-template.assets.enabled=true
quarkus.viet-template.assets.mode=production
quarkus.viet-template.assets.fail-fast=true
quarkus.viet-template.assets.public-base=/
quarkus.viet-template.assets.module-preload=true
quarkus.viet-template.assets.manifest-location=META-INF/resources/.vite/manifest.json

# Quarkus Form Auth
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error
quarkus.http.auth.form.landing-page=/secure/employees/42
quarkus.http.auth.form.post-location=/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password

# Quarkus Path Permissions
quarkus.http.auth.permission.public.paths=/health,/api/test/reset,/login,/assets/*
quarkus.http.auth.permission.public.policy=permit

# Quarkus REST CSRF
quarkus.rest-csrf.form-field-name=csrf-token
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.require-form-url-encoded=true

