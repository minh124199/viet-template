spring.application.name=spring-frontend-dev-mode-e2e
server.port=0

# Viet Template configuration
viet-template.runtime-compilation-enabled=true
viet-template.cache=false
viet-template.check-template-location=false
viet-template.suffix=.vtl
viet-template.order=1

# Frontend asset integration configuration
viet-template.assets.enabled=true
viet-template.assets.mode=development
viet-template.assets.dev-server=http://127.0.0.1:5173

# DevTools trigger file and polling intervals
spring.main.banner-mode=off
spring.devtools.restart.trigger-file=.restart-trigger
spring.devtools.restart.poll-interval=200ms
spring.devtools.restart.quiet-period=100ms
