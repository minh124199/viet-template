name: Check Deployment Status

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Sonatype Central deployment UUID'
        required: true
        type: string
      one_shot:
        description: 'Query once instead of waiting for a terminal state'
        required: true
        type: boolean
        default: false
      timeout_minutes:
        description: 'Total observation timeout in minutes'
        required: true
        type: number
        default: 120

permissions:
  contents: read

concurrency:
  group: check-central-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Query Central through shared status checker
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          ONE_SHOT: ${{ inputs.one_shot }}
        run: |
          args=("$DEPLOYMENT_ID" --timeout "$((TIMEOUT_MINUTES * 60))" --poll-interval 30)
          [[ "$ONE_SHOT" == "true" ]] && args+=(--one-shot)
          python3 scripts/check-central-deployment.py "${args[@]}"
