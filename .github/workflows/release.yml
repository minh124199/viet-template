name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate metadata, builds, bundle, and workflow without publishing"
        type: boolean
        required: true
        default: true
      recovery_deployment_id:
        description: "Optional existing Central deployment UUID; finalize without redeploying"
        type: string
        required: false
        default: ""
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release-live' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-metadata:
    name: 1. Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.metadata.outputs.project_version }}
      is_snapshot: ${{ steps.metadata.outputs.is_snapshot }}
      is_live_publish: ${{ steps.decide.outputs.is_live_publish }}
      is_recovery: ${{ steps.decide.outputs.is_recovery }}
      recovery_deployment_id: ${{ steps.decide.outputs.recovery_deployment_id }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install release contract parser
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
      - name: Verify release metadata and workflow contract
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/verify-release-metadata.py --check-workflow-contract
      - name: Decide release mode
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IS_SNAPSHOT: ${{ steps.metadata.outputs.is_snapshot }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          RECOVERY_DEPLOYMENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_deployment_id || '' }}
        run: |
          IS_LIVE="false"
          IS_RECOVERY="false"
          if [[ "$REPOSITORY" == "minh124199/viet-template" && "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            [[ "$IS_SNAPSHOT" == "false" ]] || { echo "::error::Release tags cannot point to a SNAPSHOT version."; exit 1; }
            [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::Tag workflow reruns cannot redeploy immutable coordinates. Use workflow_dispatch with the existing Central deployment ID to resume finalization."; exit 1; }
            IS_LIVE="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$RECOVERY_DEPLOYMENT_ID" ]]; then
            [[ "$DRY_RUN" == "false" ]] || { echo "::error::Recovery finalization requires dry_run=false."; exit 1; }
            [[ "$REF_TYPE" == "tag" ]] || { echo "::error::Recovery must run against the immutable release tag."; exit 1; }
            [[ "$IS_SNAPSHOT" == "false" ]] || { echo "::error::Recovery cannot target a SNAPSHOT version."; exit 1; }
            [[ "$RECOVERY_DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::Invalid Central deployment UUID."; exit 1; }
            IS_RECOVERY="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            echo "::error::Manual non-dry-run execution requires an existing recovery deployment ID; it never deploys."
            exit 1
          fi
          echo "is_live_publish=$IS_LIVE" >> "$GITHUB_OUTPUT"
          echo "is_recovery=$IS_RECOVERY" >> "$GITHUB_OUTPUT"
          echo "recovery_deployment_id=$RECOVERY_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

  verify-builds:
    name: 2. Full Build Verification & TCK
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 21 for Spotless
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Run Spotless checks
        run: |
          ./gradlew spotlessCheck --no-daemon
          ./mvnw spotless:check -B
      - name: Set up Java 17 for verification and TCK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install release test dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
      - name: Run Gradle check
        run: ./gradlew check --no-daemon -Dspotless.check.skip=true
      - name: Run Maven verify
        run: ./mvnw clean verify -B -Dspotless.check.skip=true
      - name: Run build parity verification
        run: python3 scripts/verify-build-parity.py
      - name: Run release infrastructure unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  package-and-validate-bundle:
    name: 3. Assemble & Validate Publication Bundle
    needs: [validate-metadata, verify-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Assemble unsigned release artifacts without upload
        run: |
          ./mvnw clean package -P release -Dgpg.skip=true -DskipTests -Dspotless.check.skip=true -B
          ./gradlew assemble generatePomFileForMavenJavaPublication --no-daemon -Dspotless.check.skip=true
      - name: Validate release publication bundle
        run: python3 scripts/validate-release-bundle.py --build-tool both

  guard-publication:
    name: 4. Guard Immutable Central Version
    needs: [validate-metadata, package-and-validate-bundle]
    if: needs.validate-metadata.outputs.is_live_publish == 'true' || needs.validate-metadata.outputs.is_recovery == 'true'
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.guard.outputs.already_published }}
      publication_state: ${{ steps.guard.outputs.publication_state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check target version on Maven Central
        id: guard
        env:
          VERSION: ${{ needs.validate-metadata.outputs.project_version }}
        run: python3 scripts/verify-central-release.py "$VERSION" --mode guard --github-output "$GITHUB_OUTPUT"

  publish-to-central:
    name: 5. Sign & Submit to Central
    needs: [validate-metadata, guard-publication]
    if: needs.validate-metadata.outputs.is_live_publish == 'true' && needs.guard-publication.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - name: Prohibit immutable-coordinate redeploy on rerun
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          [[ "$RUN_ATTEMPT" == "1" ]] || { echo "::error::This run attempt cannot redeploy. Resume with workflow_dispatch and the existing deployment ID."; exit 1; }
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify required publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY MAVEN_GPG_PASSPHRASE; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required release secret: $name"; exit 1; }
          done
      - name: Import GPG signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | gpg --batch --import
      - name: Configure Maven Central credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cp .github/maven-settings.xml ~/.m2/settings.xml
      - name: Submit validated auto-publishing deployment
        id: deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          ./mvnw clean deploy -P release -DskipTests -Dspotless.check.skip=true -B 2>&1 | tee central-publish.log
          python3 scripts/extract-central-deployment-id.py central-publish.log --github-output "$GITHUB_OUTPUT"
      - name: Upload submission log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: central-submission-log-${{ github.run_id }}
          path: central-publish.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Clean up credentials and keyring
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          mapfile -t fingerprints < <(gpg --list-secret-keys --with-colons --fingerprint 2>/dev/null | awk -F: '/^sec:/ {want_fingerprint=1; next} want_fingerprint && /^fpr:/ {print $10; want_fingerprint=0}')
          for fingerprint in "${fingerprints[@]}"; do
            gpg --batch --yes --delete-secret-keys "$fingerprint"
          done

  wait-for-central-publication:
    name: 6. Monitor Central Publication
    needs: [validate-metadata, guard-publication, publish-to-central]
    if: >-
      always() &&
      needs.validate-metadata.result == 'success' &&
      needs.guard-publication.result == 'success' &&
      (needs.validate-metadata.outputs.is_live_publish == 'true' || needs.validate-metadata.outputs.is_recovery == 'true') &&
      (needs.guard-publication.outputs.already_published == 'true' || needs.publish-to-central.result == 'success' || needs.validate-metadata.outputs.is_recovery == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 125
    environment: release
    outputs:
      state: ${{ steps.monitor.outputs.state }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve publication state
        id: monitor
        env:
          ALREADY_PUBLISHED: ${{ needs.guard-publication.outputs.already_published }}
          SUBMITTED_DEPLOYMENT_ID: ${{ needs.publish-to-central.outputs.deployment_id }}
          RECOVERY_DEPLOYMENT_ID: ${{ needs.validate-metadata.outputs.recovery_deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "state=PUBLISHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOYMENT_ID="${RECOVERY_DEPLOYMENT_ID:-$SUBMITTED_DEPLOYMENT_ID}"
          [[ -n "$DEPLOYMENT_ID" ]] || { echo "::error::No deployment ID is available for publication monitoring."; exit 3; }
          python3 scripts/check-central-deployment.py "$DEPLOYMENT_ID" --timeout 7200 --poll-interval 30 --github-output "$GITHUB_OUTPUT"

  verify-public-artifacts:
    name: 7. Verify Public Maven Central Artifacts
    needs: [validate-metadata, wait-for-central-publication]
    if: >-
      always() &&
      needs.wait-for-central-publication.result == 'success' &&
      needs.wait-for-central-publication.outputs.state == 'PUBLISHED'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Audit public coordinates with propagation retry
        env:
          VERSION: ${{ needs.validate-metadata.outputs.project_version }}
        run: python3 scripts/verify-central-release.py "$VERSION" --timeout 600 --poll-interval 15

  central-consumer-smoke:
    name: 8. Central-Only Maven & Gradle Consumer Smoke
    needs: [validate-metadata, verify-public-artifacts]
    if: >-
      always() &&
      needs.validate-metadata.result == 'success' &&
      needs.verify-public-artifacts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Smoke-test fresh Central-only consumers
        env:
          VERSION: ${{ needs.validate-metadata.outputs.project_version }}
        run: scripts/smoke-central-consumers.sh "$VERSION"

  create-github-release:
    name: 9. Create or Verify GitHub Release
    needs: [validate-metadata, central-consumer-smoke]
    if: >-
      always() &&
      needs.validate-metadata.result == 'success' &&
      needs.central-consumer-smoke.result == 'success' &&
      (needs.validate-metadata.outputs.is_live_publish == 'true' || needs.validate-metadata.outputs.is_recovery == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or verify idempotent GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate-metadata.outputs.tag_name }}
          VERSION: ${{ needs.validate-metadata.outputs.project_version }}
        run: |
          if gh release view "$TAG_NAME" --json tagName,isDraft >/tmp/release.json 2>/dev/null; then
            [[ "$(jq -r .tagName /tmp/release.json)" == "$TAG_NAME" ]] || { echo "::error::Existing release tag mismatch."; exit 1; }
            [[ "$(jq -r .isDraft /tmp/release.json)" == "false" ]] || { echo "::error::Existing release is still a draft."; exit 1; }
            echo "GitHub Release already exists and matches immutable tag $TAG_NAME."
          else
            gh release create "$TAG_NAME" --title "Viet Template $VERSION" --generate-notes --verify-tag
          fi
