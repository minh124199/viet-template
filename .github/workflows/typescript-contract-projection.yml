name: TypeScript Contract Projection Qualification

on:
  push:
    branches: [ main, 'research/m46a-typescript-projection', 'feat/m46b-*' ]
    paths:
      - 'viet-template-vtl-interpreter/**'
      - 'viet-template-maven-plugin/**'
      - 'viet-template-gradle-plugin/**'
      - 'scripts/verify-typescript-contract-projection*'
      - 'scripts/tests/test_verify_typescript_contract_projection.py'
      - '.github/workflows/typescript-contract-projection.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'viet-template-vtl-interpreter/**'
      - 'viet-template-maven-plugin/**'
      - 'viet-template-gradle-plugin/**'
      - 'scripts/verify-typescript-contract-projection*'
      - 'scripts/tests/test_verify_typescript_contract_projection.py'
      - '.github/workflows/typescript-contract-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typescript-qualification:
    name: TypeScript Contract Projection Qualification (Node 22, tsc 5.8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'examples/frontend-svelte-islands/package-lock.json'

      - name: Install Frontend Svelte Islands Dependencies (tsc source)
        run: npm ci --prefix examples/frontend-svelte-islands

      - name: Run TypeScript Contract Projection Qualification Script
        run: python3 scripts/verify-typescript-contract-projection.py --run-tests

      - name: Upload Qualification Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-contract-projection-report
          path: build/reports/typescript-contract-projection-qualification.json
          if-no-files-found: ignore
