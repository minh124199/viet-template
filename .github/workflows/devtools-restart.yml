name: DevTools Restart & ClassLoader Lifecycle Hardening

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  devtools-restart:
    name: Spring Boot DevTools Restart (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Spring Boot DevTools Verification Suite
        run: bash scripts/verify-devtools-restart-integration.sh

      - name: Upload DevTools Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: devtools-failure-logs-jdk${{ matrix.java-version }}
          path: |
            /tmp/*devtools*.log
            /tmp/devtools-*.html
            integration-tests/devtools/**/target/surefire-reports/
            integration-tests/devtools/**/build/reports/tests/
          if-no-files-found: ignore
