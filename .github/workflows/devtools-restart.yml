name: DevTools Restart & ClassLoader Lifecycle Hardening

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_tool:
        description: 'Build tool filter (maven, gradle, or all)'
        required: false
        default: 'all'
      target_boot:
        description: 'Spring Boot generation filter (boot3, boot4, or all)'
        required: false
        default: 'all'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  devtools-restart:
    name: Spring Boot DevTools Restart (${{ matrix.build-tool }}, ${{ matrix.boot-generation }}, JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '21'
            build-tool: 'maven'
            boot-generation: 'boot3'
          - java-version: '21'
            build-tool: 'gradle'
            boot-generation: 'boot4'
          - java-version: '25'
            build-tool: 'gradle'
            boot-generation: 'boot3'
          - java-version: '25'
            build-tool: 'maven'
            boot-generation: 'boot4'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Spring Boot DevTools Verification Suite
        run: bash scripts/verify-devtools-restart-integration.sh "${{ matrix.build-tool }}" "${{ matrix.boot-generation }}"

      - name: Upload DevTools Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devtools-failure-logs-${{ matrix.build-tool }}-${{ matrix.boot-generation }}-jdk${{ matrix.java-version }}
          path: |
            /tmp/*devtools*.log
            /tmp/devtools-*.html
            integration-tests/devtools/**/target/surefire-reports/
            integration-tests/devtools/**/build/reports/tests/
          if-no-files-found: ignore
