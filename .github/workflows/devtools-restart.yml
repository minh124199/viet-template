name: DevTools Restart & ClassLoader Lifecycle Hardening

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  devtools-restart:
    name: Spring Boot DevTools Restart (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Spring Boot DevTools Verification Suite
        run: bash scripts/verify-devtools-restart-integration.sh

      - name: Upload DevTools Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devtools-failure-logs-jdk${{ matrix.java-version }}
          path: |
            /tmp/*devtools*.log
            /tmp/devtools-*.html
            integration-tests/devtools/**/target/surefire-reports/
            integration-tests/devtools/**/build/reports/tests/
          if-no-files-found: ignore
