name: Native Image Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bootGeneration:
        description: 'Target Spring Boot generation (boot3, boot4)'
        required: false
        type: string
      buildTool:
        description: 'Target build tool (all, maven, gradle)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-image:
    name: GraalVM Native Image & Spring AOT (${{ matrix.bootGeneration }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '25'
            bootGeneration: 'boot3'
            buildTool: 'maven'
          - java: '25'
            bootGeneration: 'boot4'
            buildTool: 'gradle'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify Native Image Environment
        run: |
          java -version
          native-image --version

      - name: Run GraalVM Native Image Verification Suite
        run: bash scripts/verify-native-image-integration.sh "${{ matrix.bootGeneration }}" "${{ matrix.buildTool }}"

      - name: Upload Native Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-image-failure-logs-${{ matrix.bootGeneration }}-${{ matrix.buildTool }}-jdk${{ matrix.java }}
          path: |
            /tmp/native-app-*.log
            integration-tests/native/**/target/reports/
            integration-tests/native/**/build/reports/
          if-no-files-found: ignore

  quarkus-native-security:
    name: Quarkus Security & REST CSRF Native Image (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify Native Image Environment
        run: |
          java -version
          native-image --version

      - name: Run Quarkus Security & CSRF Native Verification Suite
        run: bash scripts/verify-quarkus-integration.sh --force-native

      - name: Upload Quarkus Native Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarkus-native-security-failure-logs-jdk${{ matrix.java }}
          path: |
            /tmp/quarkus-*.log
            integration-tests/quarkus/**/target/reports/
            integration-tests/quarkus/**/build/reports/
          if-no-files-found: ignore
