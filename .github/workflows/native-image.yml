name: Native Image Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-image:
    name: GraalVM Native Image & Spring AOT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up GraalVM JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'graalvm'
          java-version: '21'
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Verify Native Image Environment
        run: |
          java -version
          native-image --version

      - name: Run GraalVM Native Image Verification Suite
        run: bash scripts/verify-native-image-integration.sh

      - name: Upload Native Application Logs on Failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: native-image-failure-logs
          path: |
            /tmp/native-app-*.log
            integration-tests/native/**/target/reports/
            integration-tests/native/**/build/reports/
          if-no-files-found: ignore
