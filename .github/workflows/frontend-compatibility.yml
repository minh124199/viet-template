name: Frontend Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - 'viet-template-runtime/src/main/**/assets/**'
      - 'viet-template-runtime/src/test/**/assets/**'
      - 'examples/frontend-svelte-islands/**'
      - 'scripts/verify-frontend-vite-svelte*'
      - 'scripts/tests/test_verify_frontend_vite_svelte.py'
      - '.github/workflows/frontend-compatibility.yml'
      - 'docs/frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'viet-template-runtime/src/main/**/assets/**'
      - 'viet-template-runtime/src/test/**/assets/**'
      - 'examples/frontend-svelte-islands/**'
      - 'scripts/verify-frontend-vite-svelte*'
      - 'scripts/tests/test_verify_frontend_vite_svelte.py'
      - '.github/workflows/frontend-compatibility.yml'
      - 'docs/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vite-svelte:
    name: Vite + Svelte Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'examples/frontend-svelte-islands/package-lock.json'

      - name: Compile Viet Template runtime test classes
        run: ./mvnw test-compile -pl viet-template-runtime -am -B

      - name: Run Vite + Svelte Qualification Script
        run: ./scripts/verify-frontend-vite-svelte.sh

      - name: Upload Qualification Report & Manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-compatibility-report
          path: |
            build/reports/frontend-compatibility.json
            examples/frontend-svelte-islands/dist/.vite/manifest.json
          if-no-files-found: ignore
