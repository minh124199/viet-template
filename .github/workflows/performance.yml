name: Performance CI

on:
  workflow_dispatch:
    inputs:
      benchmark_pattern:
        description: 'JMH benchmark class or pattern filter'
        required: false
        default: 'VariableLookupBenchmark'
      iterations:
        description: 'JMH measurement iterations'
        required: false
        default: '3'
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  benchmark-matrix:
    name: JMH (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: J17-G1
            java: '17'
          - profile: J21-G1
            java: '21'
          - profile: J21-ZGC
            java: '21'
          - profile: J25-G1
            java: '25'
          - profile: J25-G1-COH
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Package benchmarks.jar
        run: ./gradlew :viet-template-benchmarks:benchmarkJar --no-daemon

      - name: Run JMH benchmark profile
        run: |
          PATTERN="${{ github.event.inputs.benchmark_pattern || 'VariableLookupBenchmark' }}"
          ITERS="${{ github.event.inputs.iterations || '3' }}"
          ./scripts/perf/run-benchmarks.sh \
            --profile "${{ matrix.profile }}" \
            --benchmark "$PATTERN" \
            --forks 1 \
            --warmup 2 \
            --iterations "$ITERS" \
            --measurement-time 1s

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: benchmark-results-${{ matrix.profile }}
          path: build/performance/**

  virtual-thread-stress:
    name: Virtual Threads Stress (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run concurrency & virtual thread stress suite
        run: ./scripts/perf/run-virtual-thread-stress.sh --mode smoke

  startup-matrix:
    name: Process Startup (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: J17-G1
            java: '17'
          - profile: J21-G1
            java: '21'
          - profile: J25-G1
            java: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Measure startup latency
        run: |
          ./scripts/perf/measure-startup.sh \
            --profile "${{ matrix.profile }}" \
            --mode smoke \
            --iterations 3 \
            --markdown

  jdk25-features:
    name: Java 25 Advanced Features (COH, ZGC, JFR, AOT)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Package benchmarks.jar
        run: ./gradlew :viet-template-benchmarks:benchmarkJar --no-daemon

      - name: Smoke test Compact Object Headers (COH)
        run: |
          ./scripts/perf/run-benchmarks.sh \
            --profile J25-G1-COH \
            --benchmark "VariableLookupBenchmark" \
            --forks 1 \
            --warmup 1 \
            --iterations 1

      - name: Smoke test Generational ZGC
        run: |
          ./scripts/perf/run-benchmarks.sh \
            --profile J25-ZGC \
            --benchmark "VariableLookupBenchmark" \
            --forks 1 \
            --warmup 1 \
            --iterations 1

      - name: Profile with JFR diagnostic summary
        run: ./scripts/perf/jfr-profile.sh --summary --args "300"

      - name: Run JVM AOT Cache experiment
        run: ./scripts/perf/jdk-aot-experiment.sh --iterations 20

      - name: Upload JDK 25 performance artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: performance-jdk25-features
          path: build/performance/**

  summary:
    name: Performance Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ benchmark-matrix, virtual-thread-stress, startup-matrix, jdk25-features ]
    if: always()
    steps:
      - name: Check overall performance pipeline status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Performance CI pipeline encountered failures." >&2
            exit 1
          fi
          echo "All Performance CI jobs completed successfully."
