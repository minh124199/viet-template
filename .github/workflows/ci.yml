name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # =========================================================================
  # TIER A: Primary Pipeline (Java 25 LTS Runtime & Toolchain, -release 21)
  # =========================================================================

  formatting:
    name: Tier A — Formatting (JDK 25 on ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Gradle Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run Maven Spotless check
        run: ./mvnw spotless:check -B

  gradle-build-tier-a:
    name: Tier A — Gradle (JDK 25 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Print Gradle and JVM version
        run: ./gradlew --version

      - name: Bootstrap reactor artifacts for clean-room verification
        run: ./mvnw install -DskipTests -Dspotless.check.skip=true -B

      - name: Run Gradle check
        run: ./gradlew check --no-daemon -Dspotless.check.skip=true

  maven-build-tier-a:
    name: Tier A — Maven (JDK 25 on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run Maven verify
        run: ./mvnw clean verify -B -Dspotless.check.skip=true

  tck-gates-tier-a:
    name: Tier A — M18 TCK & Performance Release Gates (JDK 25)
    runs-on: ubuntu-latest
    needs: [ maven-build-tier-a ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run self-contained M18 gates with empty Maven and Gradle state
        run: ./scripts/verify-m18-release-gates.sh --clean-room

  parity-check-tier-a:
    name: Tier A — Build Parity Verification (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Build JARs with Gradle and Maven
        run: |
          ./gradlew assemble --no-daemon
          ./mvnw package -DskipTests -B

      - name: Run Build Parity Verification Script
        run: ./scripts/verify-build-parity.sh

      - name: Publish artifacts to Maven Local
        run: |
          ./gradlew publishToMavenLocal --no-daemon -x test
          ./mvnw install -DskipTests -B -Dspotless.check.skip=true

      - name: Run AOT Tooling Parity Verification Script
        run: ./scripts/verify-aot-tooling-parity.sh

      - name: Run Spring Integration Parity Verification Script
        run: ./scripts/verify-spring-integration-parity.sh

      - name: Run Spring Security Parity Verification Script
        run: ./scripts/verify-spring-security-parity.sh

      - name: Run Spring Security 7 Integration Verification Script
        run: ./scripts/verify-spring-security7-integration.sh

  api-compatibility-tier-a:
    name: Tier A — Public API & SPI Compatibility Check (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Compile Java Classes
        run: ./gradlew compileJava --no-daemon

      - name: Run Public API Compatibility Verification
        run: python3 scripts/verify-api-compatibility.py

      - name: Run Public Surface Classification Verification
        run: python3 scripts/verify-public-surface-classification.py

  release-infrastructure-tier-a:
    name: Tier A — Release Infrastructure Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install release contract parser
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-release.txt

      - name: Validate release workflow contract
        env:
          RELEASE_TAG: ''
        run: python3 scripts/verify-release-metadata.py --check-workflow-contract --check-publication-metadata

      - name: Verify documentation
        run: python3 scripts/verify-documentation.py

      - name: Run release infrastructure unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  # =========================================================================
  # TIER B: Compatibility Test Suite (Java 21 Minimum Baseline)
  # =========================================================================

  tier-b-jdk21-compatibility:
    name: Tier B — JDK 21 Baseline Compatibility Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Print Gradle and JVM version
        run: ./gradlew --version

      - name: Bootstrap reactor artifacts for clean-room verification
        run: ./mvnw install -DskipTests -Dspotless.check.skip=true -B

      - name: Run Gradle check on Java 21
        run: ./gradlew check --no-daemon -Dspotless.check.skip=true

      - name: Run Maven verify on Java 21
        run: ./mvnw clean verify -B -Dspotless.check.skip=true
