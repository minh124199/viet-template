name: Robustness and Differential Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'Fuzzing execution mode'
        required: true
        default: 'deep'
        type: choice
        options:
          - deep
          - normal

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deep-fuzz:
    name: Deep Fuzzing (JDK ${{ matrix.java }} on ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25', '21' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Deep Fuzzing via Gradle
        run: ./gradlew test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} --no-daemon

      - name: Run Deep Fuzzing via Maven
        run: ./mvnw test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99baed6f # v4.5.0
        with:
          name: fuzz-test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/target/surefire-reports/
