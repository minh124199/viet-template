name: Robustness and Differential Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'Fuzzing execution mode'
        required: true
        default: 'deep'
        type: choice
        options:
          - deep
          - normal

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deep-fuzz:
    name: Deep Fuzzing (JDK 21 on ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Deep Fuzzing via Gradle
        run: ./gradlew test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} --no-daemon

      - name: Run Deep Fuzzing via Maven
        run: ./mvnw test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} -B
