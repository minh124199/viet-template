name: Robustness and Differential Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_mode:
        description: 'Fuzzing execution mode'
        required: true
        default: 'deep'
        type: choice
        options:
          - deep
          - normal

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deep-fuzz:
    name: Deep Fuzzing (JDK ${{ matrix.java }} on ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25', '21' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Bootstrap reactor artifacts for clean-room verification
        run: ./mvnw install -DskipTests -Dspotless.check.skip=true -B

      - name: Run Deep Fuzzing via Gradle
        run: ./gradlew test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} --no-daemon

      - name: Run Deep Fuzzing via Maven
        run: ./mvnw test -DvietTemplate.fuzz.mode=${{ inputs.fuzz_mode || 'deep' }} -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/target/surefire-reports/
          if-no-files-found: ignore
