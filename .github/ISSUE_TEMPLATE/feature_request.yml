name: Feature Request
description: Suggest an idea or enhancement for Viet Template.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - Core API (viet-template-api)
        - Runtime (viet-template-runtime)
        - Parser / AST (viet-template-language-vtl)
        - Interpreter (viet-template-vtl-interpreter)
        - TCK / Test harness (viet-template-tck)
        - Build / Tooling
        - Documentation
    validations:
      required: true
